<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <title>シフトカレンダー</title>
  <link rel="stylesheet" href="styles.css?v=20260929-2">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true">
    <defs>
      <symbol id="icon-sunrise" viewBox="0 0 24 24">
        <path d="M4 18h16M6.3 15.5a6 6 0 0 1 11.4 0M12 3v5M4.9 6.9l2.2 2.2M19.1 6.9l-2.2 2.2M2 12h3M19 12h3"/>
      </symbol>
      <symbol id="icon-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
      </symbol>
      <symbol id="icon-upload" viewBox="0 0 24 24">
        <path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>
      </symbol>
      <symbol id="icon-history" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/>
      </symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.6v-.09A1.7 1.7 0 0 0 8.5 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3V9.6h.09A1.7 1.7 0 0 0 4.6 8.5a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.5 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.13.4.35.75.66 1 .3.25.68.39 1.07.4H21v4h-.09A1.7 1.7 0 0 0 19.4 15Z"/>
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M18 6 6 18"/>
      </symbol>
    </defs>
  </svg>

  <main id="app" class="app-shell">
    <header class="app-header edit-only">
      <div>
        <p class="eyebrow">SHIFT CALENDAR</p>
        <h1>シフトカレンダー</h1>
      </div>
      <div class="header-actions">
        <button id="backupButton" class="icon-button" type="button" aria-label="バックアップを保存" title="バックアップを保存">
          <svg><use href="#icon-upload"/></svg>
        </button>
        <button id="restoreButton" class="icon-button" type="button" aria-label="バックアップから復元" title="バックアップから復元">
          <svg><use href="#icon-history"/></svg>
        </button>
        <button id="openSettings" class="icon-button" type="button" aria-label="プロジェクトとメンバーの設定" title="設定">
          <svg><use href="#icon-settings"/></svg>
        </button>
      </div>
      <input id="restoreInput" type="file" accept="application/json,.json" hidden>
    </header>

    <section class="project-bar edit-only" aria-label="プロジェクト選択">
      <label class="sr-only" for="projectSelect">プロジェクト</label>
      <select id="projectSelect"></select>
      <div class="project-actions">
        <button id="toggleWorkdayMode" class="button" type="button">勤務日設定</button>
        <button id="openShare" class="button button-primary" type="button">共有表示</button>
      </div>
    </section>

    <section id="shareHeader" class="share-header share-only" hidden>
      <h1 id="shareTitle"></h1>
      <p id="shareMeta"></p>
    </section>

    <section class="month-nav" aria-label="表示月">
      <button id="prevMonth" class="month-button edit-only" type="button" aria-label="前の月">‹</button>
      <h2 id="monthLabel"></h2>
      <button id="nextMonth" class="month-button edit-only" type="button" aria-label="次の月">›</button>
    </section>

    <section class="calendar-wrap" aria-label="月間シフト">
      <div class="week-row" aria-hidden="true">
        <span class="sun-text">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat-text">土</span>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </section>

    <section class="share-footer share-only" hidden>
      <div class="share-footer-actions">
        <button id="saveShareImage" class="button button-primary" type="button">画像を保存</button>
        <button id="closeShare" class="button" type="button">編集画面へ戻る</button>
      </div>
    </section>
  </main>

  <dialog id="workdayDialog" class="sheet-dialog workday-dialog">
    <form method="dialog" class="sheet">
      <header class="sheet-header">
        <div>
          <p class="eyebrow">勤務日設定</p>
          <h2 id="workdayProjectName"></h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="閉じる">
          <svg><use href="#icon-close"/></svg>
        </button>
      </header>

      <section class="month-nav workday-month-nav" aria-label="勤務日を設定する月">
        <button id="workdayPrevMonth" class="month-button" type="button" aria-label="前の月">‹</button>
        <h2 id="workdayMonthLabel"></h2>
        <button id="workdayNextMonth" class="month-button" type="button" aria-label="次の月">›</button>
      </section>

      <p class="workday-instruction">日付をタップすると勤務日の色を付け外しできます</p>

      <section class="calendar-wrap" aria-label="勤務日設定カレンダー">
        <div class="week-row" aria-hidden="true">
          <span class="sun-text">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat-text">土</span>
        </div>
        <div id="workdayCalendarGrid" class="calendar-grid workday-calendar-grid"></div>
      </section>
    </form>
  </dialog>

  <dialog id="dayDialog" class="sheet-dialog">
    <form method="dialog" class="sheet">
      <header class="sheet-header">
        <div class="day-heading">
          <p class="eyebrow">勤務入力</p>
          <div class="day-date-nav">
            <button id="prevDay" class="date-button" type="button" aria-label="前の日">‹</button>
            <h2 id="selectedDateLabel"></h2>
            <button id="nextDay" class="date-button" type="button" aria-label="次の日">›</button>
          </div>
        </div>
        <button class="icon-button" value="cancel" aria-label="閉じる">
          <svg><use href="#icon-close"/></svg>
        </button>
      </header>

      <div id="assignmentList" class="assignment-list"></div>
      <p id="noAssignments" class="empty-message">勤務者はまだ登録されていません</p>

      <div class="add-assignment">
        <label>
          <span>メンバー</span>
          <select id="memberSelect"></select>
        </label>
        <label>
          <span>勤務区分</span>
          <select id="slotSelect">
            <option value="all">終日</option>
            <option value="am">午前</option>
            <option value="pm">午後</option>
          </select>
        </label>
        <button id="addAssignment" class="button button-primary" type="button">＋ 追加する</button>
      </div>
      <button class="button button-block" value="cancel">完了</button>
    </form>
  </dialog>

  <dialog id="settingsDialog" class="sheet-dialog">
    <form method="dialog" class="sheet">
      <header class="sheet-header">
        <div>
          <p class="eyebrow">設定</p>
          <h2>プロジェクトとメンバー</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="閉じる">
          <svg><use href="#icon-close"/></svg>
        </button>
      </header>

      <div class="settings-section">
        <label for="settingsProjectSelect">プロジェクトを選択</label>
        <select id="settingsProjectSelect"></select>
        <div id="projectItem" class="swipe-row project-item">
          <div class="swipe-actions" aria-label="プロジェクトの操作">
            <button class="swipe-edit" type="button">編集</button>
            <button id="deleteProject" class="swipe-delete" type="button">削除</button>
          </div>
          <div class="swipe-content project-content">
            <span id="projectNameDisplay" class="project-name-display"></span>
            <input id="editProjectNameInput" class="inline-edit-input" type="text" maxlength="30" aria-label="選択中のプロジェクト名">
          </div>
        </div>
        <p class="helper swipe-helper">左にスワイプすると編集・削除できます</p>
        <label class="new-project-label" for="projectNameInput">新しいプロジェクト</label>
        <div class="inline-form">
          <input id="projectNameInput" type="text" maxlength="30" placeholder="新しいプロジェクト名">
          <button id="addProject" class="button" type="button">追加</button>
        </div>
      </div>

      <div class="settings-section">
        <h3>登録メンバー</h3>
        <div id="memberList" class="member-list"></div>
        <div class="inline-form">
          <input id="memberNameInput" type="text" maxlength="12" placeholder="表示する名前">
          <button id="addMember" class="button button-primary" type="button">登録</button>
        </div>
        <p class="helper">登録した名前が、そのままカレンダーに表示されます</p>
        <p class="helper">二本線を上下にドラッグすると並び替え、行を左にスワイプすると編集・削除できます</p>
      </div>
      <button class="button button-block" value="cancel">完了</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=20260929-2"></script>
</body>
</html>
